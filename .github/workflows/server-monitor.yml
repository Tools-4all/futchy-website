name: Server monitor

# Checks the game's server (Supabase) from outside every 5 minutes and mails the owner when it stops answering,
# a reminder every hour while it is down, and once when it is back. See tools/monitor/check.mjs.
# Secrets (Settings → Secrets and variables → Actions): HEALTH_URL, BREVO_API_KEY, ALERT_TO.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Send one test mail and stop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: server-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/monitor
      - name: Restore the last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the server
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TEST_MAIL: ${{ inputs.test_mail && '1' || '0' }}
        run: node tools/monitor/check.mjs
      - name: Save the state
        if: always() && !inputs.test_mail
        uses: actions/cache/save@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}
